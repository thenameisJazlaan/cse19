<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Only Website</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        display: grid;
        grid-template-rows: 80px 50px auto;
        grid-template-columns: 200px auto;
        height: 100vh;
        grid-template-areas:
            "header header"
            "nav nav"
            "sidebar content";
    }

    header {
        grid-area: header;
        background: #4a90e2;
        display: grid;                
        place-items: center;          
        font-size: 28px;
        color: white;
        font-weight: bold;
    }

    nav {
        grid-area: nav;
        background: #6bb5ff;
        display: grid;                
        place-items: center;          
        font-size: 20px;
        color: white;
    }

    .sidebar {
        grid-area: sidebar;
        background: #e6e6e6;
        padding: 20px;
        font-size: 20px;
        display: grid;               
        align-content: start;
    }

    .content {
        grid-area: content;
        display: grid;                
        grid-template-rows: 1fr 1fr;
        gap: 10px;
        padding: 20px;
    }

    .box {
        background: #d9ecff;
        padding: 20px;
        border-radius: 5px;
        font-size: 18px;
        display: grid;              
        align-content: center;
    }
</style>
</head>
<body>

<div class="container">

    <header>
       BAZZUCA
    </header>

    <nav>
    . HOME &nbsp;&nbsp; . ABOUT &nbsp;&nbsp; . SERVICES &nbsp;&nbsp; . CONTACT
    </nav>

    <div class="sidebar">
        ONE STOP SHOP FOR ALL YOUR SPORT NEEDS
    </div>

    <div class="content">
        <div class="box">SALE IS LIVE ON PREMIUM LEATHER BATS</div>
        <div class="box">NEW FOOTBALLS ADDED</div>
    </div>

</div>

</body>
</html>
